[package]
name = "nodiddypoker"
version = "0.2.3"
description = "NoDiddyPoker desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Windows: окно стола держит пропорцию 4:3 прямо во время перетаскивания края (сообщение окна WM_SIZING).
# Та же версия, что уже есть в Cargo.lock (её тянет сама Tauri), — новых скачиваний нет.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# маленький файл: оптимизация по размеру, без отладочной информации
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
