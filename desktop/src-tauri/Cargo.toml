[package]
name = "nodiddypoker"
version = "0.1.0"
description = "NoDiddyPoker desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# маленький файл: оптимизация по размеру, без отладочной информации
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
