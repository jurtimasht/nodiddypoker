<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoDiddyPoker — Lobby</title>
  <link rel="icon" type="image/png" href="static/favicon.png">
  <!-- Сервер сам допишет к адресам ?v=… (версию), чтобы браузер не брал старые копии -->
  <link rel="stylesheet" href="static/fonts.css">
  <link rel="stylesheet" href="static/lobby.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img class="mark" src="static/logo-mark.webp" alt="">NoDiddy<b>Poker</b></div>
    <span class="where">Lobby</span>
    <button type="button" class="logout" id="logout" hidden>Log out</button>
  </header>

  <section class="hero">
    <img src="static/logo.webp" alt="NoDiddyPoker">
  </section>

  <!-- Не вошёл: вход или регистрация (с кодом приглашения) -->
  <section class="card auth" id="auth" hidden>
    <div class="tabs authtabs" role="tablist">
      <button type="button" class="tab" role="tab" data-auth="login">Log in</button>
      <button type="button" class="tab" role="tab" data-auth="register">Create account</button>
    </div>
    <form id="authform" autocomplete="on">
      <label>Nickname<input id="authname" name="username" maxlength="16" autocomplete="username" required></label>
      <label>Password<input id="authpass" name="password" type="password" maxlength="200" autocomplete="current-password" required></label>
      <label id="invitefield">Invite code<input id="authinvite" maxlength="40" autocomplete="off" placeholder="Ask the owner for it"></label>
      <p class="muted small" id="authhint"></p>
      <button type="submit" class="gold" id="authgo">Log in</button>
      <p class="msg" id="authmsg" role="status"></p>
    </form>
  </section>

  <!-- Обновление сайта с GitHub: видит только хозяин -->
  <section class="updatebar" id="updatebar" hidden></section>

  <main class="lobby">
    <!-- Профиль: ник и фото -->
    <section class="card profile" id="profile">
      <h2>Your profile</h2>

      <!-- Профиль есть -->
      <div id="mine" hidden>
        <button type="button" class="photo" id="photo" title="Change photo">
          <span class="letter" id="letter"></span>
          <span class="hint">📷 photo</span>
        </button>
        <div class="who">
          <div class="name" id="myname"></div>
          <div class="links">
            <button type="button" class="link" id="rename">✎ Change nickname</button>
            <button type="button" class="link" id="delphoto" hidden>🗑 Remove photo</button>
            <button type="button" class="link" id="chpass">🔑 Change password</button>
          </div>
        </div>
        <form id="renameform" hidden autocomplete="off">
          <input id="renameinput" maxlength="16" required>
          <button type="submit" class="gold">OK</button>
          <button type="button" id="renamecancel">Cancel</button>
        </form>
        <form id="pwform" hidden autocomplete="on">
          <input type="text" name="username" autocomplete="username" id="pwuser" hidden>
          <input id="pwold" type="password" autocomplete="current-password" placeholder="Current password" required>
          <input id="pwnew" type="password" autocomplete="new-password" placeholder="New password (6+ characters)" required>
          <div class="row">
            <button type="submit" class="gold">Save password</button>
            <button type="button" id="pwcancel">Cancel</button>
          </div>
        </form>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <p class="msg" id="msg" role="status"></p>
    </section>

    <!-- Кто сейчас на сайте -->
    <section class="card online">
      <div class="head">
        <h2><span class="dot"></span>Online</h2>
        <span class="count" id="onlinecount"></span>
      </div>
      <ul class="people" id="people"></ul>
    </section>

    <!-- Выбор игры: кэш (3 стола) или турниры (скоро) -->
    <section class="card games">
      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="cash">💵 Cash game</button>
        <button type="button" class="tab" role="tab" data-tab="mtt">🏆 MTT</button>
      </div>

      <!-- Обе вкладки лежат в одной клетке: блок всегда высотой с бóльшую, ничего не прыгает -->
      <div class="panes">
      <div class="pane" id="pane-cash" role="tabpanel">
        <div class="tables" id="tables"></div>
        <p class="seatednote" id="seatednote" hidden></p>
        <p class="muted small hint" id="gohint"></p>
      </div>

      <div class="pane soon" id="pane-mtt" role="tabpanel">
        <img src="static/logo-mark.webp" alt="">
        <h3>Tournaments</h3>
        <p>We're working on it — multi-table tournaments are coming soon.</p>
        <span class="badge">Coming soon</span>
      </div>
      </div>
    </section>

    <!-- Таблица лидеров -->
    <section class="card leaders">
      <div class="head">
        <h2>🏆 All-time leaderboard</h2>
        <span class="muted small" id="since"></span>
      </div>
      <table>
        <thead><tr><th>#</th><th>Player</th><th>Hands</th><th>Pots won</th><th>Biggest pot</th><th>Profit</th></tr></thead>
        <tbody id="leaders"></tbody>
      </table>
      <button type="button" class="danger" id="reset" hidden>Reset statistics</button>
    </section>
  </main>

  <!-- Инструменты хозяина: код приглашения, сброс пароля, удаление аккаунта -->
  <section class="card admin" id="admin" hidden>
    <div class="head">
      <h2>🛠 Owner tools</h2>
      <span class="muted small">Only you see this</span>
    </div>
    <form id="inviteform" autocomplete="off">
      <label>Invite code <span class="muted small">— give it to friends so they can create an account</span>
        <span class="row"><input id="invitecode" maxlength="40" required><button type="submit" class="gold">Save</button></span>
      </label>
    </form>
    <h3>Players <span class="muted small" id="playercount"></span></h3>
    <ul class="plist" id="players"></ul>
  </section>

  <div class="toast" id="toast" role="status"></div>
  <script src="static/lobby.js"></script>
</body>
</html>
